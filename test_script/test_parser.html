<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Shader Pipeline Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            color: #333;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-grow: 1;
        }

        h2,
        h3 {
            margin-top: 0;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
            color: #111;
        }

        textarea {
            width: 100%;
            min-width: 500px;
            height: 500px;
            font-family: "Fira Code", monospace;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        canvas {
            border: 1px solid #ccc;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        pre {
            background-color: #f7f7f7;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            font-family: "Fira Code", monospace;
            font-size: 12px;
        }

        #controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: grid;
            grid-template-columns: 120px 1fr 60px;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 500;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #005ecb;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        input[type="file"] {
            font-size: 14px;
        }

        .error-box {
            color: #d8000c;
            background-color: #ffbaba;
            border: 1px solid #d8000c;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }

        #zoom-container-wrapper { display: none; }
        #zoom-container { display: flex; gap: 20px; }
        #zoom-original, #zoom-processed { border: 2px solid #007aff; }
    </style>
</head>

<body>

    <div class="column" style="flex-basis: 40%;">
        <h2>1. 載入 WGSL 著色器</h2>
        <input type="file" id="shader-file" accept=".wgsl">
        <textarea id="shader-code"></textarea>
        <button id="run-btn">執行管線 (Run Pipeline)</button>
        <div id="error-log"></div>
    </div>

    <div class="column" style="flex-basis: 55%;">
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <h2>2. 載入圖片</h2>
                <input type="file" id="image-file" accept="image/*">
                <h3>原始圖片</h3>
                <canvas id="canvas-original"></canvas>
            </div>
            <div style="flex: 1;">
                <h2>4. 處理結果</h2>
                <p>GPU 實際運算輸出</p>
                <h3>輸出畫布</h3>
                <canvas id="canvas-processed"></canvas>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <h2>3. 著色器參數</h2>
            <div id="controls">
                <p>執行管線以生成控制項。</p>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <h2>5. 解析資訊</h2>
            <pre id="parsed-output">Parsed data will appear here.</pre>
        </div>
    </div>

    <div class="column" style="flex-basis: 98%; flex-grow: 0;" id="zoom-container-wrapper">
        <h2>6. 細節比對 (同步放大鏡)</h2>
        <div id="zoom-container">
            <div>
                <h3>原始 (Zoomed)</h3>
                <canvas id="zoom-original"></canvas>
            </div>
            <div>
                <h3>處理後 (Zoomed)</h3>
                <canvas id="zoom-processed"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { ShaderParser } from './parser.js';

        // --- DOM Elements ---
        const shaderCodeEl = document.getElementById('shader-code');
        const runBtn = document.getElementById('run-btn');
        const shaderFileInput = document.getElementById('shader-file');
        const imageFileInput = document.getElementById('image-file');
        const controlsEl = document.getElementById('controls');
        const parsedOutputEl = document.getElementById('parsed-output');
        const canvasOriginal = document.getElementById('canvas-original');
        const ctxOriginal = canvasOriginal.getContext('2d');
        const canvasProcessed = document.getElementById('canvas-processed');
        const errorLogEl = document.getElementById('error-log');

        // --- WebGPU Globals ---
        let device, adapter, context, canvasFormat;
        let computePipeline, renderPipeline;
        let uniformBuffer;
        let inputTexture, outputTexture, sampler;
        let computeBindGroup, renderBindGroup;
        let originalImage, shaderInfo;
        let parameterValues = {};

        const parser = new ShaderParser(true);

        // --- Default Shader ---
        shaderCodeEl.value = `// 移植自 https://github.com/bloc97/Anime4K/blob/master/glsl/Denoise/Anime4K_Denoise_Bilateral_Median.glsl\n` +
`\n//!Magpie-Web EFFECT\n//!VERSION 1\n` +
`\n//!PARAMETER\n//!LABEL Strength\n//!DEFAULT 0.1\n//!MIN 0.01\n//!MAX 5\n//!STEP 0.01\nfloat intensitySigma;\n` +
`\n//!TEXTURE\nTexture2D INPUT;\n` +
`\n//!TEXTURE\n//!WIDTH INPUT_WIDTH\n//!HEIGHT INPUT_HEIGHT\nTexture2D OUTPUT;\n` +
`\n//!SAMPLER\n//!FILTER POINT\nSamplerState sam;\n` +
`\n//!PASS 1\n//!IN INPUT\n//!OUT OUTPUT\n//!BLOCK_SIZE 8\n` +
`\n// --- 綁定佈局假設 (convention) ---\n// @group(0) @binding(0): Uniform Buffer (for all parameters)\n// @group(0) @binding(1): Input Texture (INPUT)\n// @group(0) @binding(2): Output Texture (OUTPUT) - must be rgba8unorm for storage\n// @group(0) @binding(3): Sampler (sam)\n` +
`\nstruct Params {\n    intensitySigma: f32,\n};\n` +
`\n@group(0) @binding(0) var<uniform> params: Params;\n@group(0) @binding(1) var INPUT: texture_2d<f32>;\n@group(0) @binding(2) var OUTPUT: texture_storage_2d<rgba8unorm, write>;\n@group(0) @binding(3) var sam: sampler;\n` +
`\nconst SPATIAL_SIGMA: f32 = 1.0;\nconst KERNELSIZE: u32 = 3u;\nconst KERNELHALFSIZE: i32 = i32(KERNELSIZE / 2u);\nconst KERNELLEN: u32 = KERNELSIZE * KERNELSIZE;\n` +
`\nfn get_offset(i: u32) -> vec2<i32> {\n    return vec2<i32>(i32(i % KERNELSIZE) - KERNELHALFSIZE, i32(i / KERNELSIZE) - KERNELHALFSIZE);\n}\n` +
`\nfn get_luma(rgb: vec3<f32>) -> f32 {\n    return dot(vec3<f32>(0.299, 0.587, 0.114), rgb);\n}\n` +
`\nfn gaussian(x: f32, s: f32, m: f32) -> f32 {\n    let scaled = (x - m) / s;\n    return exp(-0.5 * scaled * scaled);\n}\n` +
`\nfn getMedian(v: ptr<function, array<vec3<f32>, KERNELLEN>>, w: ptr<function, array<f32, KERNELLEN>>, n: f32) -> vec3<f32> {\n    var result = vec3<f32>(0.0, 0.0, 0.0);\n    for (var i: u32 = 0u; i < KERNELLEN; i = i + 1u) {\n        var w_above: f32 = 0.0;\n        var w_below: f32 = 0.0;\n        for (var j: u32 = 0u; j < KERNELLEN; j = j + 1u) {\n            if ((*v)[j].x > (*v)[i].x) {\n                w_above = w_above + (*w)[j];\n            } else if ((*v)[j].x < (*v)[i].x) {\n                w_below = w_below + (*w)[j];\n            }\n        }\n        if ((n - w_above) / n >= 0.5 && w_below / n <= 0.5) {\n            result = (*v)[i];\n            break;\n        }\n    }\n    return result;\n}\n` +
`\n@compute @workgroup_size(8, 8, 1)\nfn main(@builtin(global_invocation_id) global_id: vec3<u32>) {\n    let gxy = global_id.xy;\n    let outputSize = vec2<u32>(textureDimensions(OUTPUT));\n    if (gxy.x >= outputSize.x || gxy.y >= outputSize.y) { return; }\n\n    let inputSize = vec2<f32>(textureDimensions(INPUT));\n    let inputPt = 1.0 / inputSize;\n    let pos = (vec2<f32>(gxy) + 0.5) * inputPt;\n\n    var histogram_v: array<vec3<f32>, KERNELLEN>;\n    var histogram_l: array<f32, KERNELLEN>;\n    var histogram_w: array<f32, KERNELLEN>;\n    var n: f32 = 0.0;\n\n    let vc = get_luma(textureSampleLevel(INPUT, sam, pos, 0.0).rgb);\n    let is = pow(vc + 0.0001, 1.0) * params.intensitySigma;\n    let ss = SPATIAL_SIGMA;\n\n    for (var i: u32 = 0u; i < KERNELLEN; i = i + 1u) {\n        let ipos = get_offset(i);\n        histogram_v[i] = textureSampleLevel(INPUT, sam, pos + vec2<f32>(ipos) * inputPt, 0.0).rgb;\n        histogram_l[i] = get_luma(histogram_v[i]);\n        histogram_w[i] = gaussian(histogram_l[i], is, vc) * gaussian(length(vec2<f32>(ipos)), ss, 0.0);\n        n = n + histogram_w[i];\n    }\n    \n    textureStore(OUTPUT, gxy, vec4<f32>(getMedian(&histogram_v, &histogram_w, n), 1.0));\n}`;

        // --- Main Initialization ---
        async function initialize() {
            if (!await initWebGPU()) return;
            setupEventListeners();
            setupZoomListeners();
            log("WebGPU Initialized. Please load an image and run the pipeline.");
        }

        // --- WebGPU Setup ---
        async function initWebGPU() {
            if (!navigator.gpu) {
                showError("WebGPU not supported on this browser.");
                return false;
            }
            try {
                adapter = await navigator.gpu.requestAdapter();
                device = await adapter.requestDevice();
                context = canvasProcessed.getContext('webgpu');
                canvasFormat = navigator.gpu.getPreferredCanvasFormat();
                context.configure({ device, format: canvasFormat });
            } catch (e) {
                showError(`WebGPU Initialization Failed: ${e.message}`);
                return false;
            }
            return true;
        }

        // --- Pipeline Logic ---
        async function setupAndRunPipeline() {
            clearError();
            if (!device) { showError("WebGPU device not initialized."); return; }
            if (!originalImage) { showError("Please load an image first."); return; }

            try {
                // 1. Parse Shader
                shaderInfo = parser.parse(shaderCodeEl.value);
                parsedOutputEl.textContent = JSON.stringify(shaderInfo, null, 2);

                // 2. Create UI
                generateControls();

                // 3. Create WebGPU Resources
                createGpuResources();

                // 4. Create Compute Pipeline
                await setupComputePipeline();

                // 5. Create Render Pipeline (for displaying the result)
                await setupRenderPipeline();

                // 6. Run
                await executePipelines();

            } catch (e) {
                showError(`Pipeline Error: ${e.message}`);
                console.error(e);
            }
        }

        function createGpuResources() {
            // Input Texture
            if (inputTexture) inputTexture.destroy();
            inputTexture = device.createTexture({
                size: [originalImage.width, originalImage.height, 1],
                format: 'rgba8unorm',
                usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
            });
            device.queue.copyExternalImageToTexture({ source: originalImage }, { texture: inputTexture }, [originalImage.width, originalImage.height]);

            // Output Texture (for compute shader) - MUST be rgba8unorm for storage
            if (outputTexture) outputTexture.destroy();
            outputTexture = device.createTexture({
                size: [originalImage.width, originalImage.height, 1],
                format: 'rgba8unorm',
                usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING,
            });

            // Sampler
            const parsedFilter = shaderInfo.samplers.find(s => s.name === 'sam')?.filter?.toLowerCase() || 'linear';
            const gpuFilterMode = parsedFilter === 'point' ? 'nearest' : 'linear';
            sampler = device.createSampler({ magFilter: gpuFilterMode, minFilter: gpuFilterMode });

            // Uniform Buffer
            const uniformBufferSize = shaderInfo.parameters.length * 4; // Assume all params are f32
            if (uniformBuffer) uniformBuffer.destroy();
            uniformBuffer = device.createBuffer({
                size: Math.max(16, uniformBufferSize), // Min size 16
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
        }

        async function setupComputePipeline() {
            const computeBindGroupLayout = device.createBindGroupLayout({
                entries: [
                    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
                    { binding: 1, visibility: GPUShaderStage.COMPUTE, texture: {} },
                    { binding: 2, visibility: GPUShaderStage.COMPUTE, storageTexture: { access: 'write-only', format: 'rgba8unorm' } },
                    { binding: 3, visibility: GPUShaderStage.COMPUTE, sampler: {} },
                ]
            });

            computePipeline = await device.createComputePipelineAsync({
                layout: device.createPipelineLayout({ bindGroupLayouts: [computeBindGroupLayout] }),
                compute: {
                    module: device.createShaderModule({ code: shaderInfo.codeBody }),
                    entryPoint: 'main'
                },
            });

            computeBindGroup = device.createBindGroup({
                layout: computePipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: inputTexture.createView() },
                    { binding: 2, resource: outputTexture.createView() },
                    { binding: 3, resource: sampler },
                ]
            });
        }

        async function setupRenderPipeline() {
            const renderShaderModule = device.createShaderModule({
                code: `
                    struct VertexOutput {
                        @builtin(position) position: vec4<f32>,
                        @location(0) uv: vec2<f32>,
                    };

                    @vertex
                    fn vs_main(@builtin(vertex_index) in_vertex_index: u32) -> VertexOutput {
                        var output: VertexOutput;
                        // Create a full-screen triangle strip
                        let x = f32((in_vertex_index << 1u) & 2u) - 1.0;
                        let y = f32(in_vertex_index & 2u) - 1.0;
                        output.position = vec4<f32>(x, -y, 0.0, 1.0);
                        output.uv = vec2<f32>(x * 0.5 + 0.5, y * 0.5 + 0.5);
                        return output;
                    }

                    @group(0) @binding(0) var mySampler: sampler;
                    @group(0) @binding(1) var myTexture: texture_2d<f32>;

                    @fragment
                    fn fs_main(@location(0) uv: vec2<f32>) -> @location(0) vec4<f32> {
                        return textureSample(myTexture, mySampler, uv);
                    }
                `,
            });

            renderPipeline = await device.createRenderPipelineAsync({
                layout: 'auto',
                vertex: { module: renderShaderModule, entryPoint: 'vs_main' },
                fragment: {
                    module: renderShaderModule,
                    entryPoint: 'fs_main',
                    targets: [{ format: canvasFormat }],
                },
                primitive: { topology: 'triangle-strip' },
            });

            renderBindGroup = device.createBindGroup({
                layout: renderPipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: sampler },
                    { binding: 1, resource: outputTexture.createView() },
                ],
            });
        }

        async function executePipelines() {
            // Update uniform buffer with current slider values
            const uniformData = new Float32Array(Object.values(parameterValues));
            device.queue.writeBuffer(uniformBuffer, 0, uniformData);

            const commandEncoder = device.createCommandEncoder();

            // Compute Pass
            const passEncoder = commandEncoder.beginComputePass();
            passEncoder.setPipeline(computePipeline);
            passEncoder.setBindGroup(0, computeBindGroup);
            const blockSize = shaderInfo.passes[0]?.block_size || 8;
            const workgroupCountX = Math.ceil(originalImage.width / blockSize);
            const workgroupCountY = Math.ceil(originalImage.height / blockSize);
            passEncoder.dispatchWorkgroups(workgroupCountX, workgroupCountY);
            passEncoder.end();

            // Render Pass (to display the result)
            const renderPassDescriptor = {
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    loadOp: 'clear',
                    clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                    storeOp: 'store',
                }],
            };
            const renderPassEncoder = commandEncoder.beginRenderPass(renderPassDescriptor);
            renderPassEncoder.setPipeline(renderPipeline);
            renderPassEncoder.setBindGroup(0, renderBindGroup);
            renderPassEncoder.draw(4);
            renderPassEncoder.end();

            await device.queue.submit([commandEncoder.finish()]);
            log(`Pipelines executed. Dispatched ${workgroupCountX}x${workgroupCountY} workgroups.`);
        }

        // --- UI and Event Handlers ---
        function generateControls() {
            controlsEl.innerHTML = '';
            parameterValues = {};
            if (!shaderInfo?.parameters.length) {
                controlsEl.innerHTML = '<p>No parameters found in shader.</p>';
                return;
            }
            shaderInfo.parameters.forEach(param => {
                const group = document.createElement('div');
                group.className = 'control-group';
                const label = document.createElement('label');
                label.textContent = param.label || param.name;
                const slider = document.createElement('input');
                slider.type = 'range';
                slider.min = param.min ?? 0; slider.max = param.max ?? 1; slider.step = param.step ?? 0.01;
                slider.value = param.default ?? (slider.min + slider.max) / 2;
                const valueSpan = document.createElement('span');
                valueSpan.textContent = slider.value;
                parameterValues[param.name] = parseFloat(slider.value);

                slider.addEventListener('input', async () => {
                    valueSpan.textContent = slider.value;
                    parameterValues[param.name] = parseFloat(slider.value);
                    if (computePipeline && renderPipeline) {
                        await executePipelines();
                    }
                });
                group.append(label, slider, valueSpan);
                controlsEl.appendChild(group);
            });
        }

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = e => {
                originalImage = new Image();
                originalImage.onload = () => {
                    canvasOriginal.width = originalImage.width;
                    canvasOriginal.height = originalImage.height;
                    ctxOriginal.drawImage(originalImage, 0, 0);
                    canvasProcessed.width = originalImage.width;
                    canvasProcessed.height = originalImage.height;
                    log(`Image "${file.name}" loaded. Ready to run pipeline.`);
                }
                originalImage.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function handleShaderFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => { shaderCodeEl.value = e.target.result; };
            reader.readAsText(file);
        }

        function setupEventListeners() {
            runBtn.addEventListener('click', setupAndRunPipeline);
            imageFileInput.addEventListener('change', (e) => handleImage(e.target.files[0]));
            shaderFileInput.addEventListener('change', (e) => handleShaderFile(e.target.files[0]));
        }

        function log(message) { console.log(message); }
        function showError(message) { console.error(message); errorLogEl.innerHTML = `<div class="error-box">${message}</div>`; }
        function clearError() { errorLogEl.innerHTML = ''; }

        // --- Zoom Loupe Logic ---
        const zoomWrapper = document.getElementById('zoom-container-wrapper');
        const zoomOriginalCanvas = document.getElementById('zoom-original');
        const zoomProcessedCanvas = document.getElementById('zoom-processed');
        const zoomOriginalCtx = zoomOriginalCanvas.getContext('2d');
        const zoomProcessedCtx = zoomProcessedCanvas.getContext('2d');

        const LOUPE_SIZE = 250;
        const ZOOM_FACTOR = 4;
        zoomOriginalCanvas.width = zoomOriginalCanvas.height = LOUPE_SIZE;
        zoomProcessedCanvas.width = zoomProcessedCanvas.height = LOUPE_SIZE;

        function updateZoom(e) {
            const rect = canvasOriginal.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const sourceSize = LOUPE_SIZE / ZOOM_FACTOR;
            const sourceX = Math.max(0, Math.min(x - sourceSize / 2, canvasOriginal.width - sourceSize));
            const sourceY = Math.max(0, Math.min(y - sourceSize / 2, canvasOriginal.height - sourceSize));

            // Redraw original canvas to clear previous selector rectangle
            ctxOriginal.drawImage(originalImage, 0, 0);

            // Draw magnified views
            zoomOriginalCtx.clearRect(0, 0, LOUPE_SIZE, LOUPE_SIZE);
            zoomOriginalCtx.drawImage(canvasOriginal, sourceX, sourceY, sourceSize, sourceSize, 0, 0, LOUPE_SIZE, LOUPE_SIZE);
            
            zoomProcessedCtx.clearRect(0, 0, LOUPE_SIZE, LOUPE_SIZE);
            zoomProcessedCtx.drawImage(canvasProcessed, sourceX, sourceY, sourceSize, sourceSize, 0, 0, LOUPE_SIZE, LOUPE_SIZE);

            // Draw selector rectangle on the original canvas
            ctxOriginal.strokeStyle = '#ff0000';
            ctxOriginal.lineWidth = 1;
            ctxOriginal.strokeRect(sourceX, sourceY, sourceSize, sourceSize);
        }

        function setupZoomListeners() {
            canvasOriginal.addEventListener('mouseenter', () => {
                if (originalImage) zoomWrapper.style.display = 'block';
            });
            canvasOriginal.addEventListener('mousemove', (e) => {
                if (originalImage) updateZoom(e);
            });
            canvasOriginal.addEventListener('mouseleave', () => {
                zoomWrapper.style.display = 'none';
                // Redraw original canvas to clear the red box
                if(originalImage) ctxOriginal.drawImage(originalImage, 0, 0);
            });
        }

        // --- Start ---
        initialize();

    </script>
</body>

</html>
