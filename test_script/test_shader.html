<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebGL 即時影像增強濾波器</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #333;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px;
            border-radius: 5px;
            width: 300px;
        }

        .control-group {
            margin-bottom: 10px;
        }

            .control-group label {
                display: block;
                margin-bottom: 5px;
            }

            .control-group input {
                width: 100%;
            }

            .control-group span {
                float: right;
            }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="controls">
        <div class="control-group">
            <label for="deblockStrength">去色塊強度 <span id="deblockStrengthVal">0.5</span></label>
            <input type="range" id="deblockStrength" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="control-group">
            <label for="deblockSigma">去色塊敏感度 <span id="deblockSigmaVal">0.1</span></label>
            <input type="range" id="deblockSigma" min="0" max="1" step="0.01" value="0.1">
        </div>
        <hr>
        <div class="control-group">
            <label for="sharpenStrength">銳化強度 <span id="sharpenStrengthVal">0.1</span></label>
            <input type="range" id="sharpenStrength" min="0" max="0.5" step="0.01" value="0.05">
        </div>
        <hr>
        <div class="control-group">
            <label for="denoiseStrength">降噪強度 <span id="denoiseStrengthVal">0.3</span></label>
            <input type="range" id="denoiseStrength" min="0" max="1" step="0.01" value="0.3">
        </div>
        <div class="control-group">
            <label for="denoiseSigma">降噪敏感度 <span id="denoiseSigmaVal">0.05</span></label>
            <input type="range" id="denoiseSigma" min="0" max="1" step="0.01" value="0.05">
        </div>
    </div>

    <script src="https://twgljs.org/dist/4.x/twgl-full.min.js"></script>

    <script>
        async function main() {
        const canvas = document.getElementById("canvas");
        const gl = twgl.getWebGLContext(canvas);

        if (!gl) {
        return alert("您的瀏覽器不支援 WebGL");
        }

        // 假設您的 glsl 檔案放在與 html 同一層的 GLSL 資料夾中
        const shaderSources = await Promise.all([
        fetch('../GLSL/vertex.glsl').then(res => res.text()),
        fetch('../GLSL/deblock.fs.glsl').then(res => res.text()),
        fetch('../GLSL/sharpen_denoise.fs.glsl').then(res => res.text()),
        ]);

        const [vs, fs_deblock, fs_sharpen_denoise] = shaderSources;

        const deblockProgram = twgl.createProgramInfo(gl, [vs, fs_deblock]);
        const sharpenDenoiseProgram = twgl.createProgramInfo(gl, [vs, fs_sharpen_denoise]);

        if (!deblockProgram || !sharpenDenoiseProgram) {
        return console.error("YouTube VSR Error: Shader 編譯失敗，請檢查瀏覽器控制台的錯誤訊息。");
        }

        const arrays = { position: [-1, -1, 0, 1, -1, 0, -1, 1, 0, -1, 1, 0, 1, -1, 0, 1, 1, 0] };
        const quad = twgl.createBufferInfoFromArrays(gl, arrays);

        const texture = twgl.createTexture(gl, {
        src: "test.png",
        crossOrigin: '',
        flipY: true,
        min: gl.LINEAR,
        mag: gl.LINEAR,
        wrap: gl.CLAMP_TO_EDGE,
        });

        const fboA = twgl.createFramebufferInfo(gl);

        // --- Uniforms 初始值 ---
        const uniforms = {
        u_frame: texture,
        u_texelSize: [0, 0],
        u_deblockStrength: 0.5,
        u_deblockSigma: 0.1,
        u_sharpenStrength: 1.0,
        u_denoiseStrength: 0.3,
        u_denoiseSigma: 0.05,
        u_inputPass: null,
        };

        // --- 連接控制項 ---
        const controls = {
        deblockStrength: document.getElementById('deblockStrength'),
        deblockSigma: document.getElementById('deblockSigma'),
        sharpenStrength: document.getElementById('sharpenStrength'),
        denoiseStrength: document.getElementById('denoiseStrength'),
        denoiseSigma: document.getElementById('denoiseSigma'),
        };

        const valueSpans = {
        deblockStrength: document.getElementById('deblockStrengthVal'),
        deblockSigma: document.getElementById('deblockSigmaVal'),
        sharpenStrength: document.getElementById('sharpenStrengthVal'),
        denoiseStrength: document.getElementById('denoiseStrengthVal'),
        denoiseSigma: document.getElementById('denoiseSigmaVal'),
        };

        // 設定監聽器，當滑桿變動時更新 uniforms 物件
        Object.keys(controls).forEach(key => {
        controls[key].addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        uniforms['u_' + key] = value;
        valueSpans[key].textContent = value.toFixed(2);
        });
        });


        function render(time) {
        if (twgl.resizeCanvasToDisplaySize(gl.canvas)) {
        twgl.resizeFramebufferInfo(gl, fboA);
        uniforms.u_texelSize = [1 / gl.canvas.width, 1 / gl.canvas.height];
        }

        // Pass 1: Deblock
        twgl.bindFramebufferInfo(gl, fboA);
        gl.useProgram(deblockProgram.program);
        twgl.setBuffersAndAttributes(gl, deblockProgram, quad);
        twgl.setUniforms(deblockProgram, uniforms);
        gl.drawArrays(gl.TRIANGLES, 0, quad.numElements);

        // Pass 2: Sharpen + Denoise
        twgl.bindFramebufferInfo(gl, null);
        gl.useProgram(sharpenDenoiseProgram.program);
        twgl.setBuffersAndAttributes(gl, sharpenDenoiseProgram, quad);
        uniforms.u_inputPass = fboA.attachments[0];
        twgl.setUniforms(sharpenDenoiseProgram, uniforms);
        gl.drawArrays(gl.TRIANGLES, 0, quad.numElements);

        requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
        }

        main();
    </script>
</body>
</html>
